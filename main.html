<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>리뷰샷 (ReviewShot) - 체험단 리뷰 전용 구도 카메라</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; overflow: hidden; }
    
    #app { display: flex; flex-direction: column; width: 100%; height: 100%; height: 100dvh; position: relative; }
    
    /* Top Bar */
    .top-bar { height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; z-index: 10; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .brand { font-size: 17px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
    .brand span { color: #10b981; font-size: 12px; background: rgba(16,185,129,0.2); padding: 2px 6px; border-radius: 4px; }
    .top-actions { display: flex; gap: 12px; }
    .icon-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; padding: 6px; }

    /* Viewfinder Container */
    .camera-viewport { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #111; }
    video { width: 100%; height: 100%; object-fit: cover; -webkit-transform: scaleX(1); transform: scaleX(1); }
    video.front-cam { -webkit-transform: scaleX(-1); transform: scaleX(-1); } /* 전면 카메라 좌우반전 */
    
    .camera-fallback { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at center, #222 0%, #0a0a0a 100%); text-align: center; padding: 20px; z-index: 1; }
    .camera-fallback p { color: #888; font-size: 14px; margin-top: 8px; line-height: 1.5; }
    .start-cam-btn { margin-top: 16px; background: #10b981; color: #fff; border: none; padding: 12px 24px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 15px; }

    /* Guide Overlay SVG */
    .guide-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

    /* Guide Guide Tag */
    .guide-tip { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; color: #34d399; border: 1px solid rgba(52,211,153,0.3); z-index: 6; pointer-events: none; text-align: center; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }

    /* Bottom Control Area */
    .bottom-bar { background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 12px 16px env(safe-area-inset-bottom, 28px) 16px; z-index: 10; display: flex; flex-direction: column; gap: 14px; }
    
    /* Preset Selector */
    .preset-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    .preset-scroll::-webkit-scrollbar { display: none; }
    .preset-chip { flex-shrink: 0; padding: 7px 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 18px; font-size: 13px; font-weight: 500; color: #ccc; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 5px; }
    .preset-chip.active { background: #10b981; color: #000; font-weight: 700; border-color: #10b981; box-shadow: 0 0 12px rgba(16,185,129,0.4); }

    /* Shutter & Gallery Row */
    .shutter-row { display: flex; justify-content: space-around; align-items: center; }
    .gallery-preview { width: 44px; height: 44px; border-radius: 8px; background: #222; border: 2px solid #444; overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 11px; color: #666; cursor: pointer; }
    .gallery-preview img { width: 100%; height: 100%; object-fit: cover; }
    
    .shutter-btn { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 4px; cursor: pointer; position: relative; }
    .shutter-inner { width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: transform 0.1s; }
    .shutter-btn:active .shutter-inner { transform: scale(0.9); background: #10b981; }
    
    .counter-badge { width: 44px; height: 44px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 12px; color: #aaa; }
    .counter-badge strong { font-size: 15px; color: #34d399; }

    /* Flash Toast */
    .toast { position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%); background: rgba(16,185,129,0.95); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; z-index: 20; pointer-events: none; text-align: center; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand">리뷰샷 (ReviewShot) <span>체험단 모드</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="flipCamBtn" title="카메라 전환">🔄</button>
        <button class="icon-btn" id="gridToggleBtn" title="삼분할 격자">📐</button>
      </div>
    </div>

    <!-- Viewfinder Area -->
    <div class="camera-viewport">
      <video id="video" autoplay playsinline muted></video>
      
      <!-- Fallback when camera not accessed -->
      <div class="camera-fallback" id="fallback">
        <div style="font-size: 36px; margin-bottom: 8px;">📸</div>
        <div style="font-size: 16px; font-weight: 600;">실시간 카메라 프리뷰</div>
        <p>아이폰에서 카메라 권한 허용 후<br>버튼을 눌러 촬영을 시작하세요.</p>
        <button class="start-cam-btn" id="startCamBtn">카메라 켜기</button>
      </div>

      <!-- Live Guide Overlay (SVG) -->
      <svg class="guide-overlay" id="overlaySvg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <g id="baseGrid" stroke="rgba(255,255,255,0.18)" stroke-width="0.3" stroke-dasharray="1 1">
          <line x1="33.3" y1="0" x2="33.3" y2="100"/>
          <line x1="66.6" y1="0" x2="66.6" y2="100"/>
          <line x1="0" y1="33.3" x2="100" y2="33.3"/>
          <line x1="0" y1="66.6" x2="100" y2="66.6"/>
        </g>
        <g id="presetLayer"></g>
      </svg>

      <!-- Tip Indicator -->
      <div class="guide-tip" id="guideTip">📦 1번 컷: 박스/구성품을 중앙 사각틀에 맞추세요</div>
      <div class="toast" id="toast">✅ 찰칵! 1장 저장 완료</div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-bar">
      <!-- Preset Chips Scroll -->
      <div class="preset-scroll" id="presetScroll">
        <button class="preset-chip active" data-preset="topview">📦 1. 언박싱 항공샷</button>
        <button class="preset-chip" data-preset="angle45">✨ 2. 본품 45도 얼짱</button>
        <button class="preset-chip" data-preset="detail">🔍 3. 제형/디테일 확대</button>
        <button class="preset-chip" data-preset="usecase">📱 4. 실사용/거치 컷</button>
        <button class="preset-chip" data-preset="fashion">👕 5. 착용/전신 핏</button>
      </div>

      <!-- Shutter Row -->
      <div class="shutter-row">
        <div class="gallery-preview" id="galleryPreview">
          <span>사진</span>
        </div>
        <button class="shutter-btn" id="shutterBtn">
          <div class="shutter-inner"></div>
        </button>
        <div class="counter-badge">
          <strong id="photoCount">0/5</strong>
          <span>장 완료</span>
        </div>
      </div>
    </div>
  </div>

  <canvas id="captureCanvas" style="display: none;"></canvas>

  <script>
    const PRESETS = {
      topview: {
        tip: "📦 1번 컷: 박스·구성품을 중앙 사각틀에 맞춰 위에서 내려찍으세요",
        render: () => `
          <rect x="20" y="20" width="60" height="60" rx="3" fill="none" stroke="#34d399" stroke-width="0.8" stroke-dasharray="3 2"/>
          <path d="M 15 25 L 15 15 L 25 15" fill="none" stroke="#fff" stroke-width="0.8"/>
          <path d="M 75 15 L 85 15 L 85 25" fill="none" stroke="#fff" stroke-width="0.8"/>
          <path d="M 15 75 L 15 85 L 25 85" fill="none" stroke="#fff" stroke-width="0.8"/>
          <path d="M 85 75 L 85 85 L 75 85" fill="none" stroke="#fff" stroke-width="0.8"/>
          <line x1="50" y1="46" x2="50" y2="54" stroke="rgba(52,211,153,0.6)" stroke-width="0.5"/>
          <line x1="46" y1="50" x2="54" y2="50" stroke="rgba(52,211,153,0.6)" stroke-width="0.5"/>
        `
      },
      angle45: {
        tip: "✨ 2번 컷: 제품 정면을 45도 각도 투시선에 맞추고 수평을 잡으세요",
        render: () => `
          <polygon points="30,30 70,30 80,75 20,75" fill="none" stroke="#34d399" stroke-width="0.8" stroke-dasharray="3 2"/>
          <line x1="10" y1="75" x2="90" y2="75" stroke="#10b981" stroke-width="0.6"/>
          <ellipse cx="50" cy="30" rx="20" ry="6" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.6" stroke-dasharray="2 1"/>
          <line x1="30" y1="30" x2="20" y2="75" stroke="rgba(52,211,153,0.5)" stroke-width="0.5"/>
          <line x1="70" y1="30" x2="80" y2="75" stroke="rgba(52,211,153,0.5)" stroke-width="0.5"/>
        `
      },
      detail: {
        tip: "🔍 3번 컷: 제형·로고·마감 디테일을 원형 포커스 안에 꽉 채우세요",
        render: () => `
          <circle cx="50" cy="50" r="24" fill="none" stroke="#34d399" stroke-width="0.9" stroke-dasharray="3 1.5"/>
          <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.4"/>
          <line x1="50" y1="20" x2="50" y2="80" stroke="rgba(52,211,153,0.4)" stroke-width="0.4"/>
          <line x1="20" y1="50" x2="80" y2="50" stroke="rgba(52,211,153,0.4)" stroke-width="0.4"/>
          <rect x="15" y="15" width="70" height="70" rx="4" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.4"/>
        `
      },
      usecase: {
        tip: "📱 4번 컷: 손에 쥐거나 책상 배치! 대각선 구도로 실사용감 살리기",
        render: () => `
          <line x1="15" y1="85" x2="65" y2="25" stroke="#34d399" stroke-width="0.8" stroke-dasharray="3 2"/>
          <line x1="65" y1="25" x2="85" y2="85" stroke="rgba(52,211,153,0.5)" stroke-width="0.6"/>
          <ellipse cx="65" cy="35" rx="16" ry="18" fill="none" stroke="#34d399" stroke-width="0.9"/>
          <circle cx="30" cy="70" r="14" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.6" stroke-dasharray="2 2"/>
        `
      },
      fashion: {
        tip: "👕 5번 컷: 머리부터 발끝까지 전신/상반신 실루엣 가이드에 맞추세요",
        render: () => `
          <ellipse cx="50" cy="22" rx="10" ry="12" fill="none" stroke="#34d399" stroke-width="0.8" stroke-dasharray="2 2"/>
          <line x1="30" y1="36" x2="70" y2="36" stroke="#34d399" stroke-width="0.8"/>
          <rect x="32" y="36" width="36" height="32" fill="none" stroke="rgba(52,211,153,0.6)" stroke-width="0.6" stroke-dasharray="3 2"/>
          <line x1="50" y1="10" x2="50" y2="92" stroke="#10b981" stroke-width="0.5"/>
          <line x1="20" y1="90" x2="80" y2="90" stroke="rgba(255,255,255,0.6)" stroke-width="0.6"/>
        `
      }
    };

    let currentPreset = 'topview';
    let currentStream = null;
    let facingMode = 'environment';
    let photoCount = 0;
    const capturedPhotos = [];

    const video = document.getElementById('video');
    const fallback = document.getElementById('fallback');
    const startCamBtn = document.getElementById('startCamBtn');
    const flipCamBtn = document.getElementById('flipCamBtn');
    const gridToggleBtn = document.getElementById('gridToggleBtn');
    const presetLayer = document.getElementById('presetLayer');
    const baseGrid = document.getElementById('baseGrid');
    const guideTip = document.getElementById('guideTip');
    const shutterBtn = document.getElementById('shutterBtn');
    const photoCountEl = document.getElementById('photoCount');
    const galleryPreview = document.getElementById('galleryPreview');
    const toast = document.getElementById('toast');
    const canvas = document.getElementById('captureCanvas');

    function setPreset(key) {
      if (!PRESETS[key]) return;
      currentPreset = key;
      const data = PRESETS[key];
      presetLayer.innerHTML = data.render();
      guideTip.textContent = data.tip;

      document.querySelectorAll('.preset-chip').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.preset === key);
      });
    }

    async function startCamera() {
      try {
        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
        }
        
        // iOS Safari 호환을 위한 유연한 제약 조건 설정
        const constraints = {
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        video.srcObject = stream;
        
        // iOS Safari 비디오 재생 보장
        await video.play().catch(e => console.log("Video play error:", e));
        
        fallback.style.display = 'none';

        // 전면 카메라일 때 좌우 반전 처리
        if (facingMode === 'user') {
          video.classList.add('front-cam');
        } else {
          video.classList.remove('front-cam');
        }
      } catch (err) {
        console.warn('Camera access error:', err);
        fallback.style.display = 'flex';
      }
    }

    flipCamBtn.addEventListener('click', () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    });

    gridToggleBtn.addEventListener('click', () => {
      baseGrid.style.display = baseGrid.style.display === 'none' ? 'block' : 'none';
    });

    document.querySelectorAll('.preset-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        setPreset(btn.dataset.preset);
      });
    });

    startCamBtn.addEventListener('click', startCamera);

    shutterBtn.addEventListener('click', () => {
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      
      if (video.videoWidth > 0) {
        // 전면 카메라로 찍은 경우 캡처본도 좌우 반전 동기화
        if (facingMode === 'user') {
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#34d399';
        ctx.font = '24px sans-serif';
        ctx.fillText(`리뷰샷 - ${currentPreset} 컷`, 40, 80);
      }
      
      const imgData = canvas.toDataURL('image/jpeg', 0.9);
      capturedPhotos.push(imgData);
      photoCount++;
      photoCountEl.textContent = `${photoCount}/5`;
      galleryPreview.innerHTML = `<img src="${imgData}">`;

      toast.textContent = `✅ [${currentPreset}] 촬영 완료! (${photoCount}/5)`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);

      const keys = Object.keys(PRESETS);
      const currentIndex = keys.indexOf(currentPreset);
      if (currentIndex < keys.length - 1) {
        setTimeout(() => {
          setPreset(keys[currentIndex + 1]);
        }, 800);
      }
    });

    setPreset('topview');
    
    // 페이지 로드 시 자동 카메라 권한 요청 시도 (아이폰 보안 정책상 사용자 인터랙션이 필요할 수 있어 실패 시 fallback 유지)
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      startCamera().catch(() => {
        fallback.style.display = 'flex';
      });
    }
  </script>
</body>
</html>
